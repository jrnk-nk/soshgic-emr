name: Clinic checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: clinic-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-tests:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production application
        run: npm run build

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test
        env:
          CI: "true"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-browser-test-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
